<g fill="#eff8fa" stroke="#c4d9df" stroke-width="1.5"><rect x="40" y="96" width="120" height="78" rx="8"/><rect x="211" y="96" width="120" height="78" rx="8"/><rect x="406" y="80" width="220" height="110" rx="8"/><rect x="706" y="90" width="160" height="92" rx="8"/><rect x="406" y="250" width="220" height="86" rx="8"/><rect x="180" y="255" width="150" height="76" rx="8"/></g>
