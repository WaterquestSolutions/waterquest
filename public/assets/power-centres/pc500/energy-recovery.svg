<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">PC500 integrated energy recovery flow</title><desc id="desc">Feed pump and filter supply the high-pressure pump. An RO membrane separates product water and high-pressure brine. Brine passes through the energy recovery motor, which assists the common drive shaft. Low-pressure brine leaves through a backpressure valve. Case drains route separately to a low-pressure drain.</desc>
