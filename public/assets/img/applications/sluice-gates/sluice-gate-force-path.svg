<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">WaterGate sluice gate sizing and force calculation diagram</title>
  <desc id="desc">Engineering sizing diagram showing upstream head, downstream level, hydrostatic force, seal friction, guide friction, actuator lift force, stroke, opening time, and data required for WaterQuest sizing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0C1A36"/><stop offset="1" stop-color="#050A18"/></linearGradient>
    <marker id="arrowAqua" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#20B8C8"/></marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#F0A080"/></marker>
  </defs>
  <rect width="1200" height="780" rx="18" fill="url(#bg)"/>
  <g opacity=".2" stroke="#20B8C8" stroke-width="1">
    <path d="M40 100h1120M40 160h1120M40 220h1120M40 280h1120M40 340h1120M40 400h1120M40 460h1120M40 520h1120M40 580h1120M40 640h1120"/>
    <path d="M100 50v640M160 50v640M220 50v640M280 50v640M340 50v640M400 50v640M460 50v640M520 50v640M580 50v640M640 50v640M700 50v640M760 50v640M820 50v640M880 50v640M940 50v640M1000 50v640M1060 50v640M1120 50v640"/>
  </g>
  <text x="42" y="52" fill="#FFFFFF" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif" font-size="24" font-weight="800">WaterGate Gate Sizing Inputs and Force Path</text>
  <text x="42" y="80" fill="#FFFFFF" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif" font-size="14">Sizing begins with civil load, head differential, friction, stroke, and required movement time before actuator selection.</text>

  <!-- Gate section -->
  <g transform="translate(92 138)">
    <rect x="0" y="0" width="470" height="452" rx="10" fill="#081020" stroke="#20B8C8" stroke-width="3"/>
    <path d="M36 74h398v142H36z" fill="#0B2D4D" stroke="#20B8C8" stroke-width="2" opacity=".95"/>
    <path d="M36 216h398v170H36z" fill="#081020" stroke="#AFC0D0" stroke-width="2"/>
    <rect x="190" y="112" width="118" height="268" fill="#122449" stroke="#20B8C8" stroke-width="4"/>
    <path d="M170 112v268M328 112v268" stroke="#AFC0D0" stroke-width="3"/>
    <line x1="249" y1="112" x2="249" y2="50" stroke="#00D4B4" stroke-width="7" marker-end="url(#arrowAqua)"/>
    <line x1="310" y1="218" x2="418" y2="218" stroke="#F0A080" stroke-width="7" marker-end="url(#arrowWarn)"/>
    <line x1="190" y1="350" x2="122" y2="350" stroke="#F0A080" stroke-width="5" marker-end="url(#arrowWarn)"/>
    <line x1="250" y1="390" x2="250" y2="426" stroke="#20B8C8" stroke-width="4" marker-end="url(#arrowAqua)"/>
    <text x="248" y="36" fill="#00C8D4" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif" font-size="13" font-weight="800" text-anchor="middle">F-ACT lift / thrust</text>
    <text x="324" y="206" fill="#FFFFFF" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif" font-size="13" font-weight="800">F-H hydrostatic</text>
    <text x="86" y="344" fill="#FFFFFF" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif" font-size="13" font-weight="800">guide + seal drag</text>
    <text x="262" y="438" fill="#00C8D4" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif" font-size="13" font-weight="800">stroke S</text>
    <text x="50" y="104" fill="#FFFFFF" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif" font-size="13">upstream level</text>
    <text x="50" y="244" fill="#FFFFFF" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif" font-size="13">downstream / channel</text>
  </g>

  <!-- Calculation flow -->
  <g transform="translate(638 134)" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif">
    <rect width="476" height="456" rx="12" fill="#081020" stroke="#20B8C8" stroke-width="3"/>
    <text x="28" y="42" fill="#FFFFFF" font-size="20" font-weight="800">Sizing sequence</text>
    <g fill="none" stroke="#20B8C8" stroke-width="2">
      <rect x="28" y="72" width="190" height="66" rx="7"/>
      <rect x="258" y="72" width="190" height="66" rx="7"/>
      <rect x="28" y="174" width="190" height="66" rx="7"/>
      <rect x="258" y="174" width="190" height="66" rx="7"/>
      <rect x="28" y="276" width="190" height="66" rx="7"/>
      <rect x="258" y="276" width="190" height="66" rx="7"/>
      <rect x="28" y="378" width="420" height="48" rx="7"/>
    </g>
    <g fill="#EEF4FA" font-size="13" font-weight="800">
      <text x="48" y="98" fill="#FFFFFF">1. Gate geometry</text>
      <text x="278" y="98" fill="#FFFFFF">2. Head differential</text>
      <text x="48" y="200" fill="#FFFFFF">3. Friction allowance</text>
      <text x="278" y="200" fill="#FFFFFF">4. Motion requirement</text>
      <text x="48" y="302" fill="#FFFFFF">5. Actuator selection</text>
      <text x="278" y="302" fill="#FFFFFF">6. HPU sizing</text>
      <text x="48" y="408" fill="#FFFFFF">7. Controls, testing, documentation, spare parts</text>
    </g>
    <g fill="#AFC0D0" font-size="12">
      <text x="48" y="120" fill="#FFFFFF">width, height, stroke, guides</text>
      <text x="278" y="120" fill="#FFFFFF">upstream vs downstream level</text>
      <text x="48" y="222" fill="#FFFFFF">seals, silt, ice, debris, wear</text>
      <text x="278" y="222" fill="#FFFFFF">open time, close time, hold</text>
      <text x="48" y="324" fill="#FFFFFF">bore, rod, mount, safety factor</text>
      <text x="278" y="324" fill="#FFFFFF">flow, pressure, filter, relief</text>
    </g>
  </g>

  <g transform="translate(74 650)" font-family="Avenir, Avenir Next, Nunito Sans, sans-serif">
    <rect width="1054" height="78" rx="8" fill="#081020" stroke="#20B8C8" stroke-width="2"/>
    <text x="24" y="29" fill="#FFFFFF" font-size="14" font-weight="800">Required data for engineering review:</text>
    <text x="24" y="54" fill="#FFFFFF" font-size="13">gate width, gate height, stroke, head pressure, seal type, guide condition, required opening time, cycle frequency, water source, controls, environment, access limits.</text>
  </g>
</svg>
