<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" role="img" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">Where water hydraulics fits at a hydro facility</title><desc id="d">Cross-section of a dam and powerhouse with six numbered actuation points: trash-rack rake, intake gate and stoplogs, spillway gate, isolation and bypass valves, unwatering and dewatering valves, draft tube gate.</desc>
