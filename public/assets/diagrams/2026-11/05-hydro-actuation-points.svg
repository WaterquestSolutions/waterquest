idth="10" height="60" fill="#00EEFF"/><path d="M900,440 L1180,440 L1180,470 L900,470 Z" fill="#00EEFF" fill-opacity="0.12"/><text x="1000" y="430" font-size="15" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Tailrace to river</text><line x1="0" y1="470" x2="1180" y2="470" stroke="#9FB3C8" stroke-width="1.5"/><circle cx="290" cy="280" r="13" fill="#00EEFF"/><text x="290" y="285" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">1</text><circle cx="325" cy="395" r="13" fill="#00EEFF"/><text x="325" y="400" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2</text><circle cx="366" cy="38" r="13" fill="#00EEFF"/><text x="366" y="43" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3</text><circle cx="700" cy="395" r="13" fill="#00EEFF"/><text x="700" y="400" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">4</text><circle cx="692" cy="453" r="13" fill="#00EEFF"/><text x="692" y="458" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">5</text><circle cx="920" cy="400" r="13" fill="#00EEFF"/><text x="920" y="405" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">6</text><rect x="880" y="30" width="300" height="250" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="900" y="60" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Water actuation points</text><circle cx="912" cy="90" r="11" fill="#00EEFF"/><text x="912" y="95" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">1</text><text x="932" y="95" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Trash-rack rake</text><circle cx="912" cy="122" r="11" fill="#00EEFF"/><text x="912" y="127" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2</text><text x="932" y="127" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Intake gate and stoplogs</text><circle cx="912" cy="154" r="11" fill="#00EEFF"/><text x="912" y="159" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3</text><text x="932" y="159" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Spillway gate</text><circle cx="912" cy="186" r="11" fill="#00EEFF"/><text x="912" y="191" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">4</text><text x="932" y="191" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Small isolation and bypass valves</text><circle cx="912" cy="218" r="11" fill="#00EEFF"/><text x="912" y="223" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">5</text><text x="932" y="223" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Unwatering and dewatering valves</text><circle cx="912" cy="250" r="11" fill="#00EEFF"/><text x="912" y="255" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">6</text><text x="932" y="255" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Draft tube gate</text><text x="20" y="520" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif" font-style="italic">Water in a selected actuation circuit removes that circuit’s hydraulic oil. Assess the complete installation.</text>
