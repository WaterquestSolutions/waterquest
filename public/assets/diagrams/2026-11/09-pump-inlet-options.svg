<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">Unboosted or boosted pump inlet</title><desc id="d">Typical unboosted and boosted family arrangements. The selected model determines its port arrangement, speed, inlet pressure and supply flow; this is not a P1 configuration drawing.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00EEFF"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
<rect x="10" y="10" width="580" height="420" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="34" y="46" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2-port unboosted</text><text x="34" y="70" font-size="14" fill="#00EEFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Typical PC / PA</text><rect x="610" y="10" width="580" height="420" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="634" y="46" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3-port boosted</text><text x="634" y="70" font-size="14" fill="#00EEFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Typical PB</text><rect x="50" y="100" width="150" height="110" rx="6" fill="#00EEFF" fill-opacity="0.12" stroke="#9FB3C8"/><line x1="50" y1="128" x2="200" y2="128" stroke="#00EEFF" stroke-dasharray="6 4"/><text x="125" y="160" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Tank</text><text x="125" y="180" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">above pump</text><rect x="260" y="250" width="120" height="70" rx="10" fill="#122954" stroke="#00EEFF" stroke-width="2"/><text x="320" y="291" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Pump</text><path d="M125,210 L125,285 L256,285" fill="none" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><text x="134" y="250" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">T  (inlet)</text><line x1="380" y1="285" x2="480" y2="285" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><text x="390" y="275" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">P  outlet</text><text x="34" y="350" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Positive inlet head at all times; the pump cannot lift water</text><text x="34" y="370" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Speed and inlet limits depend on the selected model</text><text x="34" y="390" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Size inlet supply for the selected pump and duty</text><text x="34" y="410" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Use: tank-fed power units, low-pressure mains</text><rect x="650" y="110" width="140" height="70" rx="10" fill="#122954" stroke="#9FB3C8"/><text x="720" y="142" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Boost supply</text><text x="720" y="162" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">or elevated feed</text><rect x="860" y="250" width="120" height="70" rx="10" fill="#122954" stroke="#00EEFF" stroke-width="2"/><text x="920" y="291" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Pump</text><path d="M720,180 L720,270 L856,270" fill="none" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><text x="730" y="230" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Inlet (boosted)</text><line x1="980" y1="270" x2="1080" y2="270" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><text x="990" y="260" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">P  outlet</text><path d="M920,320 L920,335 L1080,335" fill="none" stroke="#9FB3C8" stroke-width="1.6" marker-end="url(#arm)" stroke-dasharray="5 4"/><text x="990" y="328" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Case drain</text><text x="634" y="370" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Separate feed, outlet and drain ports</text><text x="634" y="390" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Confirm inlet pressure, speed and flow for the duty</text><text x="634" y="410" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">P180: boosted only; minimum 2.5 bar (36.3 psi) inlet</text>
</svg>