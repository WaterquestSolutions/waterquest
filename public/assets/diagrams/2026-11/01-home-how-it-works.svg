<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">How a water hydraulic circuit works</title><desc id="d">A drive turns the pump, the pump supplies water through valves to a cylinder for linear force or a motor for rotary torque, and the water returns through filtration to a reservoir.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00EEFF"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
<rect x="20" y="40" width="200" height="150" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="20" y="40" width="200" height="4" rx="2" fill="#00EEFF"/><text x="40" y="80" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Drive</text><text x="40" y="112.0" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Electric motor or</text><text x="40" y="130.9" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">engine supplies</text><text x="40" y="149.8" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">the energy.</text><rect x="280" y="40" width="220" height="150" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="280" y="40" width="220" height="4" rx="2" fill="#00EEFF"/><circle cx="308" cy="74" r="15" fill="#00EEFF"/><text x="308" y="79" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">1</text><text x="334" y="80" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Pump</text><text x="300" y="112.0" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Moves water. Load</text><text x="300" y="130.9" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">resistance develops</text><text x="300" y="149.8" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">the pressure.</text><rect x="560" y="40" width="230" height="150" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="560" y="40" width="230" height="4" rx="2" fill="#00EEFF"/><circle cx="588" cy="74" r="15" fill="#00EEFF"/><text x="588" y="79" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2</text><text x="614" y="80" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Valves</text><text x="580" y="112.0" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Set direction,</text><text x="580" y="130.9" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">speed and stopping.</text><rect x="860" y="10" width="320" height="120" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="860" y="10" width="320" height="4" rx="2" fill="#00EEFF"/><circle cx="888" cy="44" r="15" fill="#00EEFF"/><text x="888" y="49" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3</text><text x="914" y="50" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Cylinder</text><text x="880" y="82.0" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Linear force: lift, push, pull.</text><text x="880" y="100.9" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">F = pressure × piston area</text><rect x="860" y="150" width="320" height="120" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="860" y="150" width="320" height="4" rx="2" fill="#00EEFF"/><circle cx="888" cy="184" r="15" fill="#00EEFF"/><text x="888" y="189" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">4</text><text x="914" y="190" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Motor</text><text x="880" y="222.0" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Rotary torque and speed.</text><text x="880" y="240.9" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Torque from pressure × displacement</text><line x1="220" y1="115" x2="276" y2="115" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><line x1="500" y1="115" x2="556" y2="115" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><line x1="790" y1="100" x2="856" y2="70" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><line x1="790" y1="130" x2="856" y2="210" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="400" y="300" width="400" height="110" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="400" y="300" width="400" height="4" rx="2" fill="#00A3AD"/><text x="420" y="340" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Reservoir and filtration</text><text x="420" y="372.0" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Clean water collects, is filtered</text><text x="420" y="390.9" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">and returns to the pump inlet.</text><path d="M1020,272 L1020,355 L804,355" fill="none" stroke="#00A3AD" stroke-width="2.2" marker-end="url(#ar)"/><path d="M400,355 L390,355 L390,195" fill="none" stroke="#00A3AD" stroke-width="2.2" marker-end="url(#ar)"/><text x="1032" y="320" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Return</text><text x="300" y="262" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Recirculating</text><text x="300" y="280" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">circuit</text><text x="20" y="460" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif" font-style="italic">Same force as oil at the same pressure and piston area. Allow for friction, back-pressure and component ratings.</text>
</svg>