<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 395" width="100%" role="group" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">Three decisions before equipment is released</title><desc id="d">Define, Select and Accept stages, each with the record required, the decision it answers, and the matching template.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00EEFF"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
<rect x="10" y="20" width="360" height="330" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="10" y="20" width="360" height="4" rx="2" fill="#00EEFF"/><circle cx="40" cy="56" r="15" fill="#00EEFF"/><text x="40" y="61" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">1</text><text x="66" y="63" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Define</text><text x="32" y="100" font-size="12" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">RECORD</text><text x="32" y="122" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Duty, site conditions, interfaces and</text><text x="32" y="141" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">scope boundary</text><rect x="26" y="190" width="328" height="84" rx="10" fill="#122954" stroke="#00EEFF" stroke-width="1.2"/><text x="42" y="214" font-size="12" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">DECISION</text><text x="42" y="236" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Is the proposed equipment a credible</text><text x="42" y="255" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">candidate?</text><text x="32" y="306" font-size="12" fill="#9FB3C8" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Template</text><a href="/downloads/templates/equipment-specification.docx" aria-label="Equipment specification (.docx)"><text x="32" y="328" font-size="14" fill="#00EEFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif" text-decoration="underline">⬇ Equipment specification (.docx)</text></a><line x1="374" y1="232" x2="406" y2="232" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="410" y="20" width="360" height="330" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="410" y="20" width="360" height="4" rx="2" fill="#00EEFF"/><circle cx="440" cy="56" r="15" fill="#00EEFF"/><text x="440" y="61" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2</text><text x="466" y="63" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Select</text><text x="432" y="100" font-size="12" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">RECORD</text><text x="432" y="122" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Exact configuration, revisioned</text><text x="432" y="141" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">drawings, operating limits, materials,</text><text x="432" y="160" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">approval route</text><rect x="426" y="190" width="328" height="84" rx="10" fill="#122954" stroke="#00EEFF" stroke-width="1.2"/><text x="442" y="214" font-size="12" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">DECISION</text><text x="442" y="236" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Does the evidence satisfy the duty and</text><text x="442" y="255" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">interfaces?</text><text x="432" y="306" font-size="12" fill="#9FB3C8" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Template</text><a href="/downloads/templates/bid-comparison.docx" aria-label="Comparable bid schedule (.docx)"><text x="432" y="328" font-size="14" fill="#00EEFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif" text-decoration="underline">⬇ Comparable bid schedule (.docx)</text></a><line x1="774" y1="232" x2="806" y2="232" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="810" y="20" width="360" height="330" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="810" y="20" width="360" height="4" rx="2" fill="#00EEFF"/><circle cx="840" cy="56" r="15" fill="#00EEFF"/><text x="840" y="61" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3</text><text x="866" y="63" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Accept</text><text x="832" y="100" font-size="12" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">RECORD</text><text x="832" y="122" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Agreed FAT/SAT, as-built records,</text><text x="832" y="141" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">instructions, spares, training, closed</text><text x="832" y="160" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">deviations</text><rect x="826" y="190" width="328" height="84" rx="10" fill="#122954" stroke="#00EEFF" stroke-width="1.2"/><text x="842" y="214" font-size="12" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">DECISION</text><text x="842" y="236" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Can the owner operate and maintain it</text><text x="842" y="255" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">as agreed?</text><text x="832" y="306" font-size="12" fill="#9FB3C8" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Template</text><a href="/downloads/templates/acceptance-handover.docx" aria-label="Acceptance and handover register (.docx)"><text x="832" y="328" font-size="14" fill="#00EEFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif" text-decoration="underline">⬇ Acceptance and handover register (.docx)</text></a><text x="10" y="380" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif" font-style="italic">Supporting templates: pilot charter and lifecycle ownership ledger. Keep catalogue values, drawings, certificates and test results as separate records.</text>
</svg>