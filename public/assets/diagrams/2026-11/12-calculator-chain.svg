<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 395" width="100%" role="group" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">Which calculator to use, in order</title><desc id="d">Five calculators chained from load to cylinder force, flow rate, pump sizing and hydraulic power, with circuit-loss and business-case calculators branching off.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00EEFF"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
<rect x="10" y="40" width="200" height="150" rx="12" fill="#122954" stroke="rgba(0,200,212,0.35)" stroke-width="1.6"/><text x="110.0" y="84" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Load</text><text x="110.0" y="118" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">kN at the rod</text><line x1="212" y1="115" x2="247" y2="115" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="250" y="40" width="200" height="150" rx="12" fill="#0D2044" stroke="#00EEFF" stroke-width="1.6"/><a href="/knowledge-hub/engineering-calculators/cylinder-force-calculator/" aria-label="Cylinder force"><text x="350.0" y="84" font-size="17" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif" text-decoration="underline">Cylinder force</text></a><text x="350.0" y="118" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">F = p × A</text><text x="350.0" y="160" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Bore, rod and pressure</text><line x1="452" y1="115" x2="487" y2="115" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="490" y="40" width="200" height="150" rx="12" fill="#0D2044" stroke="#00EEFF" stroke-width="1.6"/><a href="/knowledge-hub/engineering-calculators/flow-rate-calculator/" aria-label="Flow rate"><text x="590.0" y="84" font-size="17" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif" text-decoration="underline">Flow rate</text></a><text x="590.0" y="118" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Q = A × v</text><text x="590.0" y="160" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Flow for the required speed</text><line x1="692" y1="115" x2="727" y2="115" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="730" y="40" width="200" height="150" rx="12" fill="#0D2044" stroke="#00EEFF" stroke-width="1.6"/><a href="/knowledge-hub/engineering-calculators/pump-sizing-calculator/" aria-label="Pump sizing"><text x="830.0" y="84" font-size="17" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif" text-decoration="underline">Pump sizing</text></a><text x="830.0" y="118" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Displacement × rpm</text><text x="830.0" y="160" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Pump and drive torque</text><line x1="932" y1="115" x2="967" y2="115" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="970" y="40" width="200" height="150" rx="12" fill="#0D2044" stroke="#00EEFF" stroke-width="1.6"/><a href="/knowledge-hub/engineering-calculators/hydraulic-power-calculator/" aria-label="Hydraulic power"><text x="1070.0" y="84" font-size="17" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif" text-decoration="underline">Hydraulic power</text></a><text x="1070.0" y="118" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">P = p × Q / 600</text><text x="1070.0" y="160" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Hydraulic kW (bar, L/min)</text><text x="10" y="26" font-size="13" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">LOAD → MOTION → POWER</text><rect x="250" y="240" width="440" height="110" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1" stroke-dasharray="6 5"/><a href="/knowledge-hub/engineering-calculators/pressure-drop-calculator/" aria-label="Circuit losses"><text x="270" y="272" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif" text-decoration="underline">Circuit losses</text></a><text x="270" y="298" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Pipe velocity · pressure loss · pressure drop</text><text x="270" y="322" font-size="13" fill="#00EEFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Add to the pressure the pump must supply</text><path d="M470,240 L470,195" fill="none" stroke="#00A3AD" stroke-width="1.6" marker-end="url(#ar)"/><rect x="730" y="240" width="460" height="110" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1" stroke-dasharray="6 5"/><a href="/knowledge-hub/engineering-calculators/roi-calculator/" aria-label="Business case"><text x="750" y="272" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif" text-decoration="underline">Business case</text></a><text x="750" y="298" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Energy savings · life-cycle cost · ROI</text><text x="750" y="322" font-size="13" fill="#00EEFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Compare at equal useful duty</text><path d="M1110,195 L1110,240" fill="none" stroke="#00A3AD" stroke-width="1.6" marker-end="url(#ar)"/><text x="10" y="380" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif" font-style="italic">Preliminary screening only. Check mechanical and component limits separately.</text>
</svg>