<rect x="12" y="30" width="176" height="190" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="12" y="30" width="176" height="4" rx="2" fill="#00EEFF"/><circle cx="40" cy="64" r="15" fill="#00EEFF"/><text x="40" y="69" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">1</text><text x="66" y="70" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="32" y="98" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Duty and enquiry</text><text x="32" y="150" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">You: load, motion,</text><text x="32" y="169" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">water and site</text><text x="32" y="188" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">WQ: engineering review</text><line x1="190" y1="125" x2="207" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="210" y="30" width="176" height="190" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="210" y="30" width="176" height="4" rx="2" fill="#00EEFF"/><circle cx="238" cy="64" r="15" fill="#00EEFF"/><text x="238" y="69" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2</text><text x="264" y="70" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="230" y="98" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Selection and</text><text x="230" y="118" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">quote</text><text x="230" y="150" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Equipment list,</text><text x="230" y="169" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">scope boundary,</text><text x="230" y="188" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">terms and lead time</text><line x1="388" y1="125" x2="405" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="408" y="30" width="176" height="190" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="408" y="30" width="176" height="4" rx="2" fill="#00EEFF"/><circle cx="436" cy="64" r="15" fill="#00EEFF"/><text x="436" y="69" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3</text><text x="462" y="70" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="428" y="98" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Submittals</text><text x="428" y="150" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">GA drawings,</text><text x="428" y="169" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">schematics and</text><text x="428" y="188" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">datasheets to approve</text><line x1="586" y1="125" x2="603" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="606" y="30" width="176" height="190" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="606" y="30" width="176" height="4" rx="2" fill="#00EEFF"/><circle cx="634" cy="64" r="15" fill="#00EEFF"/><text x="634" y="69" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">4</text><text x="660" y="70" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="626" y="98" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Build and factory</text><text x="626" y="118" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">test</text><text x="626" y="150" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Agreed build scope,</text><text x="626" y="169" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">pressure and function</text><text x="626" y="188" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">test record (FAT)</text><line x1="784" y1="125" x2="801" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="804" y="30" width="176" height="190" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="804" y="30" width="176" height="4" rx="2" fill="#00EEFF"/><circle cx="832" cy="64" r="15" fill="#00EEFF"/><text x="832" y="69" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">5</text><text x="858" y="70" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="824" y="98" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Delivery</text><text x="824" y="118" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">and commissioning</text><text x="824" y="150" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Agreed start-up,</text><text x="824" y="169" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">site test (SAT),</text><text x="824" y="188" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">operator training</text><line x1="982" y1="125" x2="999" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="1002" y="30" width="176" height="190" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="1002" y="30" width="176" height="4" rx="2" fill="#00EEFF"/><circle cx="1030" cy="64" r="15" fill="#00EEFF"/><text x="1030" y="69" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">6</text><text x="1056" y="70" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="1022" y="98" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Support</text><text x="1022" y="150" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Agreed spares, service</text><text x="1022" y="169" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">and technical support</text><text x="1022" y="188" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">within the agreed scope</text><rect x="12" y="250" width="1176" height="54" rx="12" fill="#122954" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="32" y="283" font-size="15" fill="#00EEFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Confirm the scope, responsibilities and written records for each stage in the quotation.</text>
