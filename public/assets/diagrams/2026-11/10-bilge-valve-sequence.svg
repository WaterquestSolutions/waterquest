<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" role="img" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">Water-actuated bilge valve: operating sequence</title><desc id="d">Four-state cycle: closed by spring, opened by hand pump, held open by pressure, returned closed by spring when actuator pressure is released through the return path; with a before-and-after comparison of oil and water actuation.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00EEFF"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
<rect x="310" y="32" width="240" height="112" rx="12" fill="#0D2044" stroke="#00EEFF" stroke-width="1.6"/><circle cx="334" cy="58" r="12" fill="#00EEFF"/><text x="334" y="63" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">1</text><text x="352" y="64" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Closed</text><text x="326" y="90" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Spring holds the valve shut. No</text><text x="326" y="107" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">pressure in the actuator.</text><rect x="520" y="202" width="240" height="112" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.6"/><circle cx="544" cy="228" r="12" fill="#00EEFF"/><text x="544" y="233" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2</text><text x="562" y="234" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Opening</text><text x="536" y="260" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Hand pump pressurizes the</text><text x="536" y="277" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">actuator with water; the valve</text><text x="536" y="294" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">lifts.</text><rect x="310" y="372" width="240" height="112" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.6"/><circle cx="334" cy="398" r="12" fill="#00EEFF"/><text x="334" y="403" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3</text><text x="352" y="404" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Open</text><text x="326" y="430" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Pressure holds the valve open</text><text x="326" y="447" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">for drainage or transfer.</text><rect x="100" y="202" width="240" height="112" rx="12" fill="#0D2044" stroke="#00EEFF" stroke-width="1.6"/><circle cx="124" cy="228" r="12" fill="#00EEFF"/><text x="124" y="233" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">4</text><text x="142" y="234" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Spring closing</text><text x="116" y="260" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Return path releases pressure;</text><text x="116" y="277" font-size="12.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">the spring returns the valve closed.</text><path d="M554,100 Q582.0,100 610,198" fill="none" stroke="#00EEFF" stroke-width="2" marker-end="url(#ar)"/><path d="M610,302 Q582.0,400 554,400" fill="none" stroke="#00EEFF" stroke-width="2" marker-end="url(#ar)"/><path d="M306,400 Q278.0,400 250,302" fill="none" stroke="#00EEFF" stroke-width="2" marker-end="url(#ar)"/><path d="M250,198 Q278.0,100 306,100" fill="none" stroke="#00EEFF" stroke-width="2" marker-end="url(#ar)"/><text x="430" y="244" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">DN200 PN6</text><text x="430" y="268" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">water-actuated</text><text x="430" y="286" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">globe valve</text><rect x="820" y="70" width="360" height="150" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="840" y="102" font-size="16" fill="#9FB3C8" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Before</text><text x="840" y="128" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Oil-actuated valve. A failed seal</text><text x="840" y="147" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">released hydraulic oil into the</text><text x="840" y="166" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">bilge tank, which then had to</text><text x="840" y="185" font-size="13.5" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">be pumped and cleaned.</text><rect x="820" y="250" width="360" height="150" rx="12" fill="#0D2044" stroke="#00EEFF" stroke-width="1.6"/><text x="840" y="282" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">After</text><text x="840" y="308" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Water in the actuation circuit.</text><text x="840" y="327" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">A seal leak releases water, not</text><text x="840" y="346" font-size="13.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">oil. Return path releases pressure.</text>
</svg>