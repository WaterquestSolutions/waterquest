<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="100%" role="img" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">Sizing a gate actuator starts with the gate load</title><desc id="d">Seven gate inputs combine into the load case, which sets cylinder bore and rod, stroke, pump flow, relief setting, controls and tubing size.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00EEFF"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
<text x="20" y="28" font-size="14" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Your gate data</text><text x="1180" y="28" font-size="14" fill="#00EEFF" font-weight="700" text-anchor="end" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">What we size</text><rect x="20" y="44" width="300" height="40" rx="20" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="42" y="70" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Gate width × height</text><line x1="322" y1="64" x2="420" y2="166" stroke="#9FB3C8" stroke-width="1.4" marker-end="url(#arm)"/><rect x="20" y="96" width="300" height="40" rx="20" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="42" y="122" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Differential head</text><line x1="322" y1="116" x2="420" y2="174" stroke="#9FB3C8" stroke-width="1.4" marker-end="url(#arm)"/><rect x="20" y="148" width="300" height="40" rx="20" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="42" y="174" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Seal drag</text><line x1="322" y1="168" x2="420" y2="182" stroke="#9FB3C8" stroke-width="1.4" marker-end="url(#arm)"/><rect x="20" y="200" width="300" height="40" rx="20" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="42" y="226" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Guide friction</text><line x1="322" y1="220" x2="420" y2="190" stroke="#9FB3C8" stroke-width="1.4" marker-end="url(#arm)"/><rect x="20" y="252" width="300" height="40" rx="20" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="42" y="278" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Debris, silt and ice</text><line x1="322" y1="272" x2="420" y2="198" stroke="#9FB3C8" stroke-width="1.4" marker-end="url(#arm)"/><rect x="20" y="304" width="300" height="40" rx="20" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="42" y="330" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Required travel speed</text><line x1="322" y1="324" x2="420" y2="206" stroke="#9FB3C8" stroke-width="1.4" marker-end="url(#arm)"/><rect x="20" y="356" width="300" height="40" rx="20" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><text x="42" y="382" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Fail position</text><line x1="322" y1="376" x2="420" y2="214" stroke="#9FB3C8" stroke-width="1.4" marker-end="url(#arm)"/><rect x="426" y="130" width="348" height="150" rx="14" fill="#122954" stroke="#00EEFF" stroke-width="1.8"/><text x="600" y="182" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Gate load case</text><text x="600" y="212.0" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Maximum force across the full</text><text x="600" y="230.9" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="middle" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">travel, opening and closing</text><line x1="776" y1="205" x2="876" y2="86" stroke="#00EEFF" stroke-width="1.6" marker-end="url(#ar)"/><rect x="880" y="66" width="300" height="40" rx="20" fill="#0D2044" stroke="#00EEFF" stroke-width="1.2"/><text x="902" y="92" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Cylinder bore and rod</text><line x1="776" y1="205" x2="876" y2="138" stroke="#00EEFF" stroke-width="1.6" marker-end="url(#ar)"/><rect x="880" y="118" width="300" height="40" rx="20" fill="#0D2044" stroke="#00EEFF" stroke-width="1.2"/><text x="902" y="144" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Stroke</text><line x1="776" y1="205" x2="876" y2="190" stroke="#00EEFF" stroke-width="1.6" marker-end="url(#ar)"/><rect x="880" y="170" width="300" height="40" rx="20" fill="#0D2044" stroke="#00EEFF" stroke-width="1.2"/><text x="902" y="196" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Pump flow</text><line x1="776" y1="205" x2="876" y2="242" stroke="#00EEFF" stroke-width="1.6" marker-end="url(#ar)"/><rect x="880" y="222" width="300" height="40" rx="20" fill="#0D2044" stroke="#00EEFF" stroke-width="1.2"/><text x="902" y="248" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Relief setting</text><line x1="776" y1="205" x2="876" y2="294" stroke="#00EEFF" stroke-width="1.6" marker-end="url(#ar)"/><rect x="880" y="274" width="300" height="40" rx="20" fill="#0D2044" stroke="#00EEFF" stroke-width="1.2"/><text x="902" y="300" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Controls and PLC interface</text><line x1="776" y1="205" x2="876" y2="346" stroke="#00EEFF" stroke-width="1.6" marker-end="url(#ar)"/><rect x="880" y="326" width="300" height="40" rx="20" fill="#0D2044" stroke="#00EEFF" stroke-width="1.2"/><text x="902" y="352" font-size="14.5" fill="#FFFFFF" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Tubing size</text><rect x="20" y="420" width="1160" height="56" rx="10" fill="#122954" stroke="rgba(0,200,212,0.35)" stroke-width="1" stroke-dasharray="6 5"/><text x="40" y="446" font-size="14" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Retrofit check before sizing:</text><text x="250" y="446" font-size="14" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">existing frame, guide wear, mounting structure, access envelope, electrical service, PLC interface.</text><text x="40" y="466" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif" font-style="italic">Check gate condition and binding before selecting actuator force.</text>
</svg>