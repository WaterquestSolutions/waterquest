<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" width="100%" role="img" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">How a WaterQuest project runs (mobile)</title><desc id="d">Six steps from enquiry to support, stacked vertically for phones.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00EEFF"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
<rect x="10" y="10" width="400" height="100" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><circle cx="40" cy="44" r="15" fill="#00EEFF"/><text x="40" y="49" font-size="16" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">1</text><text x="66" y="50" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Duty and enquiry</text><text x="66" y="74" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">You send load, motion, water and site.</text><text x="66" y="96" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">We run an engineering review.</text><line x1="40" y1="110" x2="40" y2="127" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="10" y="128" width="400" height="100" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><circle cx="40" cy="162" r="15" fill="#00EEFF"/><text x="40" y="167" font-size="16" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2</text><text x="66" y="168" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Selection and quote</text><text x="66" y="192" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Equipment list, scope boundary,</text><text x="66" y="214" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">terms and lead time.</text><line x1="40" y1="228" x2="40" y2="245" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="10" y="246" width="400" height="100" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><circle cx="40" cy="280" r="15" fill="#00EEFF"/><text x="40" y="285" font-size="16" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3</text><text x="66" y="286" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Submittals</text><text x="66" y="310" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">GA drawings, schematics and</text><text x="66" y="332" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">datasheets for your approval.</text><line x1="40" y1="346" x2="40" y2="363" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="10" y="364" width="400" height="100" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><circle cx="40" cy="398" r="15" fill="#00EEFF"/><text x="40" y="403" font-size="16" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">4</text><text x="66" y="404" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Build and factory test</text><text x="66" y="428" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Agreed build scope, pressure and</text><text x="66" y="450" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">function test record (FAT).</text><line x1="40" y1="464" x2="40" y2="481" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="10" y="482" width="400" height="100" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><circle cx="40" cy="516" r="15" fill="#00EEFF"/><text x="40" y="521" font-size="16" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">5</text><text x="66" y="522" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Delivery and commissioning</text><text x="66" y="546" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Agreed start-up, site test (SAT),</text><text x="66" y="568" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">operator training.</text><line x1="40" y1="582" x2="40" y2="599" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="10" y="600" width="400" height="100" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><circle cx="40" cy="634" r="15" fill="#00EEFF"/><text x="40" y="639" font-size="16" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">6</text><text x="66" y="640" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Support</text><text x="66" y="664" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Spares, service and technical support</text><text x="66" y="686" font-size="17" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">within the agreed scope.</text>
</svg>