<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 335" width="100%" role="img" aria-labelledby="t d" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">
<title id="t">How a water hydraulics pilot runs</title><desc id="d">Five steps from defining the question to measuring results, then a decision gate: proceed, adjust and repeat, or stop.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00EEFF"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
<rect x="10" y="40" width="172" height="170" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="10" y="40" width="172" height="4" rx="2" fill="#00EEFF"/><circle cx="38" cy="74" r="15" fill="#00EEFF"/><text x="38" y="79" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">1</text><text x="64" y="80" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="30" y="104" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Define the</text><text x="30" y="124" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">question</text><text x="30" y="154" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">What must improve,</text><text x="30" y="172" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">and by how much?</text><line x1="184" y1="125" x2="207" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="210" y="40" width="172" height="170" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="210" y="40" width="172" height="4" rx="2" fill="#00EEFF"/><circle cx="238" cy="74" r="15" fill="#00EEFF"/><text x="238" y="79" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">2</text><text x="264" y="80" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="230" y="104" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Agree roles</text><text x="230" y="154" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Host, supplier,</text><text x="230" y="172" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">integrator, costs,</text><text x="230" y="190" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">acceptance</text><line x1="384" y1="125" x2="407" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="410" y="40" width="172" height="170" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="410" y="40" width="172" height="4" rx="2" fill="#00EEFF"/><circle cx="438" cy="74" r="15" fill="#00EEFF"/><text x="438" y="79" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">3</text><text x="464" y="80" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="430" y="104" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Record the</text><text x="430" y="124" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">baseline</text><text x="430" y="154" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Present duty, service</text><text x="430" y="172" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">effort, problem</text><line x1="584" y1="125" x2="607" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="610" y="40" width="172" height="170" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="610" y="40" width="172" height="4" rx="2" fill="#00EEFF"/><circle cx="638" cy="74" r="15" fill="#00EEFF"/><text x="638" y="79" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">4</text><text x="664" y="80" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="630" y="104" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Run the trial</text><text x="630" y="154" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Water unit on the</text><text x="630" y="172" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">agreed duty</text><line x1="784" y1="125" x2="807" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><rect x="810" y="40" width="172" height="170" rx="12" fill="#0D2044" stroke="rgba(0,200,212,0.35)" stroke-width="1.2"/><rect x="810" y="40" width="172" height="4" rx="2" fill="#00EEFF"/><circle cx="838" cy="74" r="15" fill="#00EEFF"/><text x="838" y="79" font-size="14" fill="#0E284A" font-weight="800" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">5</text><text x="864" y="80" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif"></text><text x="830" y="104" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Measure</text><text x="830" y="154" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Against the criteria</text><text x="830" y="172" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">set in step 1</text><line x1="984" y1="125" x2="1008" y2="125" stroke="#00EEFF" stroke-width="2.2" marker-end="url(#ar)"/><path d="M1090,55 L1170,125 L1090,195 L1010,125 Z" fill="#122954" stroke="#00EEFF" stroke-width="2"/><text x="1090" y="121" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Decision</text><text x="1090" y="139" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">gate</text><line x1="1090" y1="196" x2="1090" y2="232" stroke="#00EEFF" stroke-width="1.6"/><line x1="569.0" y1="232" x2="1090" y2="232" stroke="#00EEFF" stroke-width="1.6"/><line x1="569.0" y1="232" x2="569.0" y2="252" stroke="#00EEFF" stroke-width="1.6" marker-end="url(#ar)"/><rect x="456" y="256" width="226" height="64" rx="10" fill="#0D2044" stroke="#00EEFF" stroke-width="1.6"/><text x="474" y="283" font-size="16" fill="#00EEFF" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Proceed</text><text x="474" y="306" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Roll out to similar equipment</text><line x1="813.0" y1="232" x2="813.0" y2="252" stroke="#00A3AD" stroke-width="1.6" marker-end="url(#ar)"/><rect x="700" y="256" width="226" height="64" rx="10" fill="#0D2044" stroke="#00A3AD" stroke-width="1.6"/><text x="718" y="283" font-size="16" fill="#00A3AD" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Adjust</text><text x="718" y="306" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Change one variable, repeat</text><line x1="1057.0" y1="232" x2="1057.0" y2="252" stroke="#9FB3C8" stroke-width="1.6" marker-end="url(#arm)"/><rect x="944" y="256" width="226" height="64" rx="10" fill="#0D2044" stroke="#9FB3C8" stroke-width="1.6"/><text x="962" y="283" font-size="16" fill="#9FB3C8" font-weight="700" text-anchor="start" font-family="Montserrat, Avenir, 'Nunito Sans', 'Segoe UI', sans-serif">Stop</text><text x="962" y="306" font-size="13" fill="#9FB3C8" font-weight="400" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Stopping criterion met</text><rect x="10" y="256" width="420" height="64" rx="10" fill="#122954" stroke="rgba(0,200,212,0.35)" stroke-width="1" stroke-dasharray="6 5"/><text x="28" y="282" font-size="13.5" fill="#00EEFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">Stopping criteria and approval gates</text><text x="28" y="301" font-size="13.5" fill="#00EEFF" font-weight="600" text-anchor="start" font-family="'Nunito Sans', 'Segoe UI', system-ui, sans-serif">are agreed before the trial starts.</text>
</svg>