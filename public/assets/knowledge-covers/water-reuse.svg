<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc"><title id="title">Water goes around again</title><desc id="desc">A powered pump sends water to move a load. The returning water collects in a tank and feeds the pump again. The pump always needs an energy supply.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#00eeff"/></marker><linearGradient id="steel"><stop stop-color="#f1f7fc"/><stop offset=".5" stop-color="#9bb2c8"/><stop offset="1" stop-color="#eef7ff"/></linearGradient></defs><rect width="760" height="620" rx="24" fill="#0b1b34"/><g font-family="Arial,sans-serif" fill="#f5f8ff"><text x="380" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#f5f8ff">Water goes around again.</text><text x="380" y="90" text-anchor="middle" font-size="25" font-weight="400" fill="#b9cfdf">Push it. Use it. Bring it back.</text><path d="M227 230H508" stroke="#00eeff" stroke-width="14" fill="none" marker-end="url(#arrow)"/><path d="M653 300H716V463H511" stroke="#00eeff" stroke-width="14" fill="none" marker-end="url(#arrow)"/><path d="M254 463H70V303H105" stroke="#00eeff" stroke-width="14" fill="none" marker-end="url(#arrow)"/><circle cx="151" cy="239" r="69" fill="#143b56" stroke="#b9cfdf" stroke-width="8"/><path d="M127 204L190 239L127 274Z" fill="#00eeff"/><path d="M72 239H34V172" fill="none" stroke="#b9cfdf" stroke-width="7"/><rect x="16" y="136" width="36" height="38" rx="7" fill="#b9cfdf"/><path d="M24 121V137M44 121V137" stroke="#b9cfdf" stroke-width="7"/><text x="151" y="355" text-anchor="middle" font-size="28" font-weight="700" fill="#f5f8ff">1. Pump</text><text x="64" y="114" text-anchor="middle" font-size="23" font-weight="400" fill="#b9cfdf">Power in</text><rect x="543" y="214" width="110" height="108" rx="12" fill="#174e65" stroke="#b9cfdf" stroke-width="7"/><path d="M553 275H643" stroke="#eef7ff" stroke-width="16"/><rect x="588" y="167" width="20" height="108" fill="url(#steel)"/><rect x="535" y="134" width="126" height="46" rx="8" fill="url(#steel)"/><path d="M688 254V174" stroke="#00eeff" stroke-width="10" marker-end="url(#arrow)"/><text x="598" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#f5f8ff">2. Move the load</text><rect x="254" y="407" width="257" height="129" rx="16" fill="#143b56" stroke="#b9cfdf" stroke-width="7"/><path d="M261 462Q292 442 323 462T385 462T447 462T504 462V519Q504 529 494 529H270Q261 529 261 519Z" fill="#00eeff" opacity=".75"/><text x="383" y="447" text-anchor="middle" font-size="26" font-weight="700" fill="#f5f8ff">Water tank</text><text x="380" y="582" text-anchor="middle" font-size="27" font-weight="700" fill="#f5f8ff">3. Collect the water for reuse</text></g></svg>