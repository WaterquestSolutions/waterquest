<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc"><title id="title">Same squeeze. Same push.</title><desc id="desc">Water and oil at equal pressure push on identically sized pistons. They give equal ideal force. Actual force also depends on friction, opposing pressure and component limits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#00eeff"/></marker><linearGradient id="steel"><stop stop-color="#f1f7fc"/><stop offset=".5" stop-color="#9bb2c8"/><stop offset="1" stop-color="#eef7ff"/></linearGradient></defs><rect width="760" height="620" rx="24" fill="#0b1b34"/><g font-family="Arial,sans-serif" fill="#f5f8ff"><text x="380" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#f5f8ff">Same squeeze. Same push.</text><text x="380" y="90" text-anchor="middle" font-size="26" font-weight="400" fill="#b9cfdf">Same pressure + same-size piston</text><rect x="137" y="249" width="146" height="218" rx="13" fill="#00eeff" fill-opacity=".5" stroke="#b9cfdf" stroke-width="8"/><path d="M147 304H273" stroke="#eef7ff" stroke-width="18"/><rect x="198" y="216" width="24" height="88" fill="url(#steel)"/><rect x="123" y="169" width="174" height="61" rx="9" fill="url(#steel)"/><path d="M210 155V115" stroke="#00eeff" stroke-width="10" marker-end="url(#arrow)"/><path d="M168 416V345" stroke="#00eeff" stroke-width="7" marker-end="url(#arrow)"/><path d="M252 416V345" stroke="#00eeff" stroke-width="7" marker-end="url(#arrow)"/><text x="210" y="506" text-anchor="middle" font-size="27" font-weight="700" fill="#00eeff">WATER</text><rect x="477" y="249" width="146" height="218" rx="13" fill="#8fa9c0" fill-opacity=".5" stroke="#b9cfdf" stroke-width="8"/><path d="M487 304H613" stroke="#eef7ff" stroke-width="18"/><rect x="538" y="216" width="24" height="88" fill="url(#steel)"/><rect x="463" y="169" width="174" height="61" rx="9" fill="url(#steel)"/><path d="M550 155V115" stroke="#00eeff" stroke-width="10" marker-end="url(#arrow)"/><path d="M508 416V345" stroke="#00eeff" stroke-width="7" marker-end="url(#arrow)"/><path d="M592 416V345" stroke="#00eeff" stroke-width="7" marker-end="url(#arrow)"/><text x="550" y="506" text-anchor="middle" font-size="27" font-weight="700" fill="#00eeff">OIL</text><text x="380" y="341" text-anchor="middle" font-size="70" font-weight="700" fill="#00eeff">=</text><text x="380" y="560" text-anchor="middle" font-size="29" font-weight="700" fill="#f5f8ff">Both can lift the same load.</text><text x="380" y="596" text-anchor="middle" font-size="19" font-weight="400" fill="#b9cfdf">Ideal force. Real machines also have friction and limits.</text></g></svg>