<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="405" viewBox="0 0 1120 405" role="img" aria-labelledby="title desc"><title id="title">Water parks and wave pools: conceptual system flow</title><desc id="desc">Separate water loop to Pump + filtration to Safety-controlled valve to Guarded mechanism. Position feedback confirms the commanded motion. Attraction controls govern permissives, emergency stopping and supervised restart; pool treatment remains separate.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#00c4d2" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#0b192b"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="20" font-weight="700" fill="#00EEFF">CONCEPTUAL SYSTEM FLOW</text><path d="M269 147 H296" fill="none" stroke="#00c4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="92" width="238" height="110" rx="10" fill="#10253b" stroke="#31546a"/><text x="46" y="118" font-size="17" font-weight="700" fill="#00EEFF">01</text><text x="46" y="150" font-size="21" font-weight="700" fill="#FFFFFF">Separate water loop</text><path d="M545 147 H572" fill="none" stroke="#00c4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="304" y="92" width="238" height="110" rx="10" fill="#10253b" stroke="#31546a"/><text x="322" y="118" font-size="17" font-weight="700" fill="#00EEFF">02</text><text x="322" y="150" font-size="21" font-weight="700" fill="#FFFFFF">Pump + filtration</text><path d="M821 147 H848" fill="none" stroke="#00c4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="92" width="238" height="110" rx="10" fill="#10253b" stroke="#31546a"/><text x="598" y="118" font-size="17" font-weight="700" fill="#00EEFF">03</text><text x="598" y="150" font-size="21" font-weight="700" fill="#FFFFFF">Safety-controlled</text><text x="598" y="175" font-size="21" font-weight="700" fill="#FFFFFF">valve</text><rect x="856" y="92" width="238" height="110" rx="10" fill="#10253b" stroke="#31546a"/><text x="874" y="118" font-size="17" font-weight="700" fill="#00EEFF">04</text><text x="874" y="150" font-size="21" font-weight="700" fill="#FFFFFF">Guarded mechanism</text><rect x="28" y="237" width="1064" height="100" rx="10" fill="#15364b"/><text x="46" y="270" font-size="21" fill="#FFFFFF">Actuator → managed return water → supply tank</text><text x="30" y="381" font-size="16" fill="#FFFFFF">Functional overview • Not a construction drawing</text></g></svg>